<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d91b7a">
  <title>GTA Vice City Web - Tarayıcıda Oyna</title>
  <link rel="icon" href="https://gta.rabisco.net/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="/play/play.css">
  <style>
    body {
      margin: 0;
      background: #101216;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #000;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    .hero-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(16,18,22,0.95), rgba(30,10,25,0.9)), url('https://gta.rabisco.net/assets/play/268ff48be4e874becefc3a56bb83114df7d32a48d0f9c59ccfa2dda9f09dae29.webp');
      background-size: cover;
      background-position: center;
      z-index: 10;
      transition: opacity 0.5s ease;
    }
    .logo-title {
      font-size: 54px;
      font-weight: 900;
      font-style: italic;
      color: #ff3399;
      text-shadow: 3px 3px 0px #00ffff, 6px 6px 0px #000;
      margin: 0 0 10px 0;
      letter-spacing: -1px;
    }
    .subtitle {
      font-size: 20px;
      color: #00ffff;
      margin-bottom: 30px;
      text-shadow: 1px 1px 4px #000;
    }
    .play-btn {
      padding: 16px 42px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #ff007f, #7928ca);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .play-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.9);
    }
    .status-text {
      margin-top: 15px;
      font-size: 15px;
      color: #e0e0e0;
      min-height: 24px;
    }
    .controls-box {
      margin-top: 30px;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 20px;
      font-size: 14px;
    }
    .controls-box kbd {
      background: #2a2c35;
      padding: 3px 8px;
      border-radius: 4px;
      border-bottom: 2px solid #111;
      font-weight: bold;
      color: #00ffff;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
  <div id="fps" hidden style="position:fixed;top:10px;left:10px;color:#00ff00;font-weight:bold;z-index:99;"></div>

  <div id="gate" class="hero-container">
    <div class="logo-title">VICE CITY WEB</div>
    <div class="subtitle">Tarayıcında Ücretsiz & İndirmesiz Nostalji</div>

    <button id="play" class="play-btn">🎮 Oyunu Başlat</button>
    <div id="status" class="status-text"></div>

    <div class="controls-box">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Yürüme / Sürüş</div>
      <div><kbd>F</kbd> / <kbd>Enter</kbd> Araca Binme</div>
      <div><kbd>Boşluk</kbd> Zıplama / El Freni</div>
      <div><kbd>Esc</kbd> Menü</div>
    </div>
  </div>

  <p id="loading" hidden></p>
  <dialog id="save-help" hidden></dialog>
  <button id="save-help-open" hidden></button>
  <button id="save-help-close" hidden></button>
  <button id="save-protect" hidden></button>
  <p id="save-storage-status" hidden></p>
  <button id="retry" hidden></button>

  <script type="module" src="/play/entry.js"></script>
</body>
</html>
